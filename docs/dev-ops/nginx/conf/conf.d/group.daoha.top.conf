server {
    listen       80;
    listen  [::]:80;
    server_name  group.daoha.top;

    # 强制将所有 HTTP 请求重定向到 HTTPS
    rewrite ^(.*) https://$server_name$1 permanent;
}

server {
    listen 443 ssl;
    server_name group.daoha.top;

    # SSL 证书配置 (请确保这里的路径与你在宿主机挂载进容器的路径一致)
    ssl_certificate      /etc/nginx/ssl/_.daoha.top.pem;
    ssl_certificate_key  /etc/nginx/ssl/_.daoha.top.key;

    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;

    ssl_ciphers  HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  on;

    # ==========================================
    # 1. 前端页面路由 (处理 HTML、CSS、JS 等静态资源)
    # ==========================================
    location / {
            # 【修改这里】直接使用标准路径
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
    }

    # ==========================================
        # 2. 后端接口反向代理 (微服务路由分发)
        # ==========================================

        # 路由 1：拼团商城核心业务 (拦截 /api/v1/gbm/ 开头的请求)
        location ^~ /api/v1/gbm/ {
            # 转发到处于同一 my-network 网桥下的 group-buy-me 容器
            proxy_pass http://myddd:8091;

            # 传递真实请求头信息给 Java 后端
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # 路由 2：支付宝支付业务 (拦截 /api/v1/alipay/ 开头的请求)
        location ^~ /api/v1/alipay/ {

            proxy_pass http://myddd:7860;

            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ==========================================
            # 4. 微信开放平台回调路由 (转发给 myddd)
            # ==========================================
            # 拦截微信服务器发来的验签和扫码事件通知
            location ^~ /api/v1/weixin/ {
                # 准确指向 myddd 容器的 7860 端口
                proxy_pass http://myddd:7860;

                proxy_set_header   Host              $http_host;
                proxy_set_header   X-Real-IP         $remote_addr;
                proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header   X-Forwarded-Proto $scheme;
            }

            # ==========================================
            # 5. 前端用户登录业务路由 (转发给 myddd)
            # ==========================================
            # 拦截前端发起的获取二维码、校验登录状态请求
            location ^~ /api/v1/login/ {
                # 同样指向 myddd 容器的 7860 端口
                proxy_pass http://myddd:7860;

                proxy_set_header   Host              $http_host;
                proxy_set_header   X-Real-IP         $remote_addr;
                proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header   X-Forwarded-Proto $scheme;
            }

    # ==========================================
    # 3. 错误页面配置
    # ==========================================
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
