<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S Pay Mall - 潮玩拼团</title>
    <style>
        /* ==========================================
           1. 活力少年风 - 全局变量与基础样式
           ========================================== */
        :root {
            --primary-color: #2b80ff;
            --primary-hover: #1a6ff0;
            --accent-color: #ff9f43;
            --accent-light: #f0f7ff;
            --bg-color: #f5f8fc;
            --text-main: #2d3436;
            --text-light: #8395a7;
            --card-shadow: 0 12px 28px rgba(43, 128, 255, 0.08);
            --jelly-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #f5f8fc 0%, #eef2f7 100%);
            background-image: radial-gradient(#c8d6e5 2px, transparent 2px);
            background-size: 24px 24px;
            color: var(--text-main);
            padding-bottom: 90px; min-height: 100vh;
        }

        .container {
            max-width: 480px; margin: 0 auto; background: #ffffff;
            min-height: 100vh; position: relative; box-shadow: var(--card-shadow);
        }

        @media (min-width: 481px) {
            .container {
                margin-top: 20px; margin-bottom: 20px;
                min-height: calc(100vh - 40px); border-radius: 24px;
                overflow: hidden; border: 4px solid #fff;
            }
        }

        /* 头像与轮播图 */
        .user-avatar-container {
            position: absolute; top: 20px; right: 20px; z-index: 100;
            display: none; transition: transform 0.4s var(--jelly-ease);
        }
        .user-avatar-container:hover { transform: scale(1.15) rotate(8deg); }
        .user-avatar-container img {
            width: 48px; height: 48px; border-radius: 14px;
            border: 3px solid #fff; box-shadow: 0 4px 12px rgba(43, 128, 255, 0.3);
            object-fit: cover; background-color: #fff;
        }

        .carousel {
            position: relative; width: 100%; height: 350px;
            overflow: hidden; background: #f1f2f6;
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
        }
        .slides { width: 100%; height: 100%; display: flex; }
        .slide { min-width: 100%; height: 100%; object-fit: contain; background: #fff; }
        .carousel-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9); color: var(--primary-color);
            border: none; width: 38px; height: 38px; border-radius: 12px;
            font-size: 18px; font-weight: bold; display: flex; align-items: center;
            justify-content: center; cursor: pointer; z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: all 0.2s;
        }
        .carousel-btn:active {
            transform: translateY(-50%) scale(0.85); background: var(--primary-color); color: #fff;
        }
        .carousel-btn.prev { left: 15px; }
        .carousel-btn.next { right: 15px; }

        /* 商品信息与拼团列表 */
        .product-info { padding: 20px 20px 10px; background: #fff; }
        .product-title { font-size: 20px; font-weight: 800; line-height: 1.4; margin-bottom: 12px; color: #2f3640; }
        .discount-banner {
            background: var(--accent-light); color: var(--primary-color);
            padding: 10px 15px; border-radius: 12px; font-size: 14px; display: inline-block;
            width: 100%; font-weight: bold; border-left: 4px solid var(--accent-color);
        }
        .discount-banner span { background: var(--accent-color); color: white; padding: 2px 8px; border-radius: 6px; margin-right: 8px; font-weight: 800; }

        .group-buy-list { padding: 0 20px; background: #fff; }
        .group-item { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid #f1f2f6; }
        .group-item:last-child { border-bottom: none; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-info .avatar { width: 45px; height: 45px; border-radius: 12px; object-fit: cover; border: 2px solid var(--accent-light); }
        .user-details h4 { font-size: 16px; margin-bottom: 4px; color: #2f3640; }
        .user-details p { font-size: 12px; color: var(--text-light); display: flex; align-items: center; }

        .live-dot {
            width: 6px; height: 6px; background-color: #ff4757; border-radius: 50%;
            display: inline-block; margin: 0 6px; animation: breathe 1.5s infinite ease-in-out;
        }
        @keyframes breathe {
            0% { opacity: 0.3; box-shadow: 0 0 0px rgba(255, 71, 87, 0); }
            50% { opacity: 1; box-shadow: 0 0 6px rgba(255, 71, 87, 0.6); }
            100% { opacity: 0.3; box-shadow: 0 0 0px rgba(255, 71, 87, 0); }
        }

        .user-details .time { color: var(--primary-color); font-weight: 800; font-family: monospace; font-size: 14px; }

        .join-btn {
            background: var(--primary-color); color: white; border: none; padding: 8px 16px;
            border-radius: 10px; font-size: 13px; font-weight: 800; cursor: pointer;
            box-shadow: 0 4px 10px rgba(43, 128, 255, 0.3); transition: all 0.2s var(--jelly-ease);
        }
        .join-btn:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .join-btn:active { transform: translateY(2px) scale(0.95); box-shadow: 0 2px 5px rgba(43, 128, 255, 0.3); }

        /* 底部操作栏 */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
            background: #fff; display: flex; padding: 12px 20px 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
            gap: 15px; z-index: 50; border-top-left-radius: 20px; border-top-right-radius: 20px;
        }
        .btn-buy-alone, .btn-buy-group {
            flex: 1; padding: 14px 0; border: none; border-radius: 14px; font-size: 15px;
            font-weight: 800; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-buy-alone { background: #f1f2f6; color: #576574; border-bottom: 4px solid #ced6e0; }
        .btn-buy-group { background: var(--accent-color); color: white; border-bottom: 4px solid #e17e10; }
        .btn-buy-alone:active, .btn-buy-group:active { transform: translateY(4px); border-bottom-width: 0px; margin-bottom: 4px; }

        /* 通用弹窗样式 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(45, 52, 54, 0.7); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #fff; border-radius: 20px; width: 85%; max-width: 320px;
            padding: 30px 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: jellyPop 0.4s var(--jelly-ease) forwards; text-align: center;
            border-top: 6px solid var(--primary-color);
        }
        @keyframes jellyPop { 0% { transform: scale(0.9) translateY(20px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }

        .payment-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: #2d3436; }
        .payment-amount { font-size: 28px; margin-bottom: 10px; color: var(--accent-color); font-weight: 900; }

        .alipay-logo-text { font-size: 16px; font-weight: bold; margin: 10px 0 25px; color: #00a8ff; display: flex; align-items: center; justify-content: center; gap: 8px;}

        .payment-actions { display: flex; gap: 15px; }
        .btn-cancel, .btn-confirm {
            flex: 1; border: none; padding: 12px; border-radius: 12px;
            cursor: pointer; font-weight: 800; font-size: 15px; transition: all 0.2s;
        }
        .btn-cancel { background: #f1f2f6; color: #576574; }
        .btn-cancel:hover { background: #dfe4ea; }
        .btn-confirm { background: var(--primary-color); color: white; }
        .btn-confirm:hover { background: var(--primary-hover); box-shadow: 0 4px 12px rgba(43, 128, 255, 0.4); }
        .btn-cancel:active, .btn-confirm:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="container">
    <div class="user-avatar-container" id="userAvatar">
        <img src="" id="topAvatarImg" alt="用户头像">
    </div>

    <div class="carousel" id="carousel">
        <div class="slides" id="slides">
            <img src="./images/sku1.png" class="slide" alt="商品图1">
            <img src="./images/sku2.png" class="slide" alt="商品图2">
            <img src="./images/sku3.png" class="slide" alt="商品图3">
        </div>
        <button class="carousel-btn prev" id="btnPrev">&#10094;</button>
        <button class="carousel-btn next" id="btnNext">&#10095;</button>
    </div>

    <div class="product-info">
        <h2 class="product-title" id="productTitle">装备加载中... ⚡️</h2>
        <div class="discount-banner" id="discountBanner">
            <span>限时</span> 资源拉取中...
        </div>
    </div>

    <div class="group-buy-list" id="groupBuyList"></div>

    <div class="bottom-bar">
        <button class="btn-buy-alone buy-btn" id="btnBuyAlone" data-amount="100">单独购买</button>
        <button class="btn-buy-group buy-btn" id="btnBuyGroup" data-amount="40">发起组队</button>
    </div>
</div>

<div class="modal-overlay" id="paymentModal">
    <div class="modal-content">
        <div class="payment-title">确认订单并支付 🛒</div>
        <div class="payment-amount" id="paymentAmountText">¥0</div>
        <div class="alipay-logo-text">支付方式：🔷 支付宝</div>
        <div class="payment-actions">
            <button class="btn-cancel" id="btnCancelPay">取消支付</button>
            <button class="btn-confirm" id="btnPayNow">立即支付</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // ==========================================
        // 全局配置与状态变量
        // ==========================================
        const BASE_URL = 'http://127.0.0.1:8091';
        const ALIPAY_BASE_URL = 'http://127.0.0.1:7860';

        // 动态变量：根据后端接口回传的数据填充
        let globalGoodsId = "9890001";
        let globalActivityId = 100123;

        // 当前交易上下文状态
        let tradeContext = {
            actionType: '', // 'single'(单刷), 'start'(发起), 'join'(加入)
            teamId: '',
            amount: 0
        };

        // ==========================================
        // 1. 无缝无限轮播图逻辑 (保持不变)
        // ==========================================
        const slidesContainer = document.getElementById('slides');
        const slideElements = document.querySelectorAll('.slide');
        const totalRealSlides = slideElements.length;

        if (totalRealSlides > 0) {
            const firstClone = slideElements[0].cloneNode(true);
            const lastClone = slideElements[totalRealSlides - 1].cloneNode(true);
            slidesContainer.appendChild(firstClone);
            slidesContainer.insertBefore(lastClone, slideElements[0]);

            let currentSlide = 1;
            let isTransitioning = false;
            slidesContainer.style.transform = `translateX(-${currentSlide * 100}%)`;

            function changeSlide(direction) {
                if (isTransitioning) return;
                isTransitioning = true;
                currentSlide += direction;
                slidesContainer.style.transition = 'transform 0.4s ease-in-out';
                slidesContainer.style.transform = `translateX(-${currentSlide * 100}%)`;
            }

            slidesContainer.addEventListener('transitionend', () => {
                isTransitioning = false;
                if (currentSlide === 0) {
                    slidesContainer.style.transition = 'none';
                    currentSlide = totalRealSlides;
                    slidesContainer.style.transform = `translateX(-${currentSlide * 100}%)`;
                } else if (currentSlide === totalRealSlides + 1) {
                    slidesContainer.style.transition = 'none';
                    currentSlide = 1;
                    slidesContainer.style.transform = `translateX(-${currentSlide * 100}%)`;
                }
            });

            document.getElementById('btnPrev').addEventListener('click', () => changeSlide(-1));
            document.getElementById('btnNext').addEventListener('click', () => changeSlide(1));
            setInterval(() => changeSlide(1), 3000);
        }

        // ==========================================
        // 2. 动态文字头像生成逻辑 (保持不变)
        // ==========================================
        function getAvatarDataURI(name) {
            if (!name) name = "U";
            const char = name.charAt(0).toUpperCase();
            const colors = ['#2b80ff', '#ff9f43', '#00cec9', '#6c5ce7', '#00b894', '#e84393'];
            const color = colors[char.charCodeAt(0) % colors.length] || colors[0];
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${color}" rx="25"/><text x="50%" y="50%" font-size="45" fill="#fff" font-weight="900" font-family="sans-serif" text-anchor="middle" dy=".35em">${char}</text></svg>`;
            return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
            }
            return null;
        }

        const username = getCookie('username');
        const isLoggedIn = !!username;

        if (isLoggedIn) {
            document.getElementById('topAvatarImg').src = getAvatarDataURI(username);
            document.getElementById('userAvatar').style.display = 'block';
        }

        // ==========================================
        // 3. API 接口对接与动态渲染逻辑
        // ==========================================
        function parseTimeToSeconds(timeStr) {
            if(!timeStr) return 0;
            const parts = timeStr.split(':');
            if(parts.length === 3) return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(parts[2]);
            return 0;
        }

        async function fetchMarketConfig() {
            try {
                const response = await fetch(`${BASE_URL}/api/v1/gbm/index/query_group_buy_market_config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        "userId": username || "unknown",
                        "source": "s01",
                        "channel": "c01",
                        "goodsId": "9890001"
                    })
                });

                const res = await response.json();
                if (res.code === "0000" && res.data) {
                    renderPageData(res.data);
                } else {
                    console.error("接口获取失败:", res.info);
                }
            } catch (error) {
                console.error("请求异常:", error);
            }
        }

        function renderPageData(data) {
            const { goods, teamList, teamStatistic, activityId } = data;

            // 更新动态全局变量
            if (activityId) globalActivityId = activityId;
            if (goods && goods.goodsId) globalGoodsId = goods.goodsId;

            if (goods && goods.goodsName) {
                document.getElementById('productTitle').innerText = goods.goodsName;
            }

            const deductionPrice = goods?.deductionPrice || 0;
            const userCount = teamStatistic?.allTeamUserCount || 0;
            document.getElementById('discountBanner').innerHTML = `<span>🔥 BUFF加成</span> 直降 ¥${deductionPrice}, 已有 ${userCount} 玩家加入队伍`;

            // 价格分配：单刷 -> originalPrice, 组队 -> payPrice
            if(goods) {
                const btnAlone = document.getElementById('btnBuyAlone');
                btnAlone.innerText = `单刷 (¥${goods.originalPrice})`;
                btnAlone.setAttribute('data-amount', goods.originalPrice);

                const btnGroup = document.getElementById('btnBuyGroup');
                btnGroup.innerText = `发起组队 (¥${goods.payPrice})`;
                btnGroup.setAttribute('data-amount', goods.payPrice);
            }

            const groupBuyList = document.getElementById('groupBuyList');
            groupBuyList.innerHTML = '';

            if (!teamList || teamList.length === 0) {
                groupBuyList.innerHTML = `<div style="text-align:center; padding: 40px 15px; color: var(--text-light); font-size: 14px; font-weight:bold;">🎮 暂无开放的队伍，快来做房主吧！</div>`;
            } else {
                teamList.forEach(team => {
                    const remainCount = team.targetCount - team.lockCount;
                    const avatarSrc = getAvatarDataURI(team.userId);
                    const totalSeconds = parseTimeToSeconds(team.validTimeCountdown);

                    // 加入队伍金额：payPrice
                    const itemHtml = `
                    <div class="group-item">
                        <div class="user-info">
                            <img class="avatar" src="${avatarSrc}" alt="${team.userId}">
                            <div class="user-details">
                                <h4>ID: ${team.userId}</h4>
                                <p>队伍缺 ${remainCount} 人 <i class="live-dot"></i> <span class="time timer-display" data-time="${totalSeconds}">${team.validTimeCountdown}</span></p>
                            </div>
                        </div>
                        <button class="join-btn buy-btn" data-amount="${goods?.payPrice || 0}" data-team-id="${team.teamId}">加入队伍</button>
                    </div>`;
                    groupBuyList.insertAdjacentHTML('beforeend', itemHtml);
                });
            }
        }

        // ==========================================
        // 4. 点击动作 -> 呼出统一支付弹窗
        // ==========================================
        const paymentModal = document.getElementById('paymentModal');

        document.body.addEventListener('click', function(e) {
            if (e.target.classList.contains('buy-btn')) {
                const amount = e.target.getAttribute('data-amount');

                if (!isLoggedIn) {
                    window.location.href = 'login.html';
                    return;
                }

                // 判断点击来源并记录到交易上下文
                tradeContext.amount = amount;
                if (e.target.id === 'btnBuyAlone') {
                    tradeContext.actionType = 'single';
                    tradeContext.teamId = '';
                } else if (e.target.id === 'btnBuyGroup') {
                    tradeContext.actionType = 'start';
                    tradeContext.teamId = '';
                } else {
                    tradeContext.actionType = 'join';
                    tradeContext.teamId = e.target.getAttribute('data-team-id') || "";
                }

                // 显示支付弹窗及金额
                document.getElementById('paymentAmountText').innerText = `¥${amount}`;
                paymentModal.style.display = 'flex';
            }
        });

        // ==========================================
        // 5. 取消支付 与 直接调用支付宝接口
        // ==========================================
        document.getElementById('btnCancelPay').addEventListener('click', () => {
            paymentModal.style.display = 'none'; // 点击取消支付直接关闭窗口
        });

        document.getElementById('btnPayNow').addEventListener('click', async () => {
            const marketType = tradeContext.actionType === 'single' ? 0 : 1;

            try {
                // 访问支付宝创建订单接口
                const payRes = await fetch(`${ALIPAY_BASE_URL}/api/v1/alipay/create_pay_order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        "userId": username,
                        "productId": globalGoodsId, // 动态读取的 goodsId
                        "teamId": tradeContext.teamId,
                        "activityId": globalActivityId, // 动态读取的 activityId
                        "marketType": marketType // 单刷为0，组队为1
                    })
                });

                const payData = await payRes.json();

                if (payData.code === "0000") {
                    // 获取返回的 HTML 表单并注入自动提交
                    const formHtml = payData.data;
                    document.body.insertAdjacentHTML('beforeend', formHtml);
                    document.forms[document.forms.length - 1].submit();
                } else {
                    // 非成功状态
                    alert("支付失败请稍后再试");
                }
            } catch (error) {
                console.error("创建支付宝订单异常:", error);
                alert("支付失败请稍后再试");
            }
        });

        // 倒计时工具
        setInterval(() => {
            document.querySelectorAll('.timer-display').forEach(el => {
                let t = parseInt(el.getAttribute('data-time') || 0);
                if(t > 0) {
                    t--; el.setAttribute('data-time', t);
                    let h = Math.floor(t / 3600).toString();
                    let m = Math.floor((t % 3600) / 60).toString().padStart(2, '0');
                    let s = (t % 60).toString().padStart(2, '0');
                    el.innerText = `${h}:${m}:${s}`;
                }
            });
        }, 1000);

        // 初始化加载页面数据
        fetchMarketConfig();
    });
</script>
</body>
</html>
