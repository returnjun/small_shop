<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>carazy拼团活动</title>
    <link rel="stylesheet" href="./CSS/index.css">
</head>
<body>

<div class="container">
    <div class="user-avatar-container" id="userAvatar">
        <img src="" id="topAvatarImg" alt="用户头像">
    </div>

    <div class="carousel" id="carousel">
        <div class="slides" id="slides">
            <img src="./images/sku1.png" class="slide" alt="商品图1">
            <img src="./images/sku2.png" class="slide" alt="商品图2">
            <img src="./images/sku3.png" class="slide" alt="商品图3">
        </div>
        <button class="carousel-btn prev" id="btnPrev">&#10094;</button>
        <button class="carousel-btn next" id="btnNext">&#10095;</button>
    </div>

    <div class="product-info">
        <h2 class="product-title" id="productTitle">装备加载中... ⚡️</h2>
        <div class="discount-banner" id="discountBanner">
            <span>限时</span> 资源拉取中...
        </div>
    </div>

    <div class="group-buy-list" id="groupBuyList"></div>

    <div class="bottom-bar">
        <button class="btn-buy-alone buy-btn" id="btnBuyAlone" data-amount="100">单独购买</button>
        <button class="btn-buy-group buy-btn" id="btnBuyGroup" data-amount="40">发起组队</button>
    </div>
</div>

<div class="modal-overlay" id="paymentModal">
    <div class="modal-content">
        <div class="payment-title">确认订单并支付 🛒</div>
        <div class="payment-amount" id="paymentAmountText">¥0</div>
        <div class="alipay-logo-text">支付方式：🔷 支付宝</div>
        <div class="payment-actions">
            <button class="btn-cancel" id="btnCancelPay">取消支付</button>
            <button class="btn-confirm" id="btnPayNow">立即支付</button>
        </div>
    </div>
</div>

<script src="./js/index.js"></script>
</body>
</html>
