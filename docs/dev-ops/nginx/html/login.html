<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S Pay Mall - 安全登录</title>
    <style>
        :root {
            --primary-color: #00c250; /* 柔和的微信绿 */
            --accent-color: #ff9a9e;  /* 可爱的点缀粉 */
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --card-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-gradient);
            /* 添加一点可爱的背景波浪或圆点暗示（可选） */
            background-image: radial-gradient(#ffceec 1px, transparent 1px);
            background-size: 30px 30px;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 登录卡片：增加悬浮呼吸动画 */
        .login-container {
            background: #ffffff;
            padding: 45px 30px;
            border-radius: 35px; /* 更大的圆角显得更可爱 */
            box-shadow: var(--card-shadow);
            text-align: center;
            width: 100%;
            max-width: 360px;
            position: relative;
            animation: float 6s ease-in-out infinite; /* 灵动的上下浮动 */
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            margin: 0 0 8px 0;
            color: #4a4a4a;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 25px;
            background: #f4f6f8;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* 二维码区域：增加果冻回弹效果 */
        .qr-wrapper {
            position: relative;
            display: inline-block;
            padding: 12px;
            background: #fff;
            border: 2px dashed #ffe5ec; /* 可爱的虚线边框 */
            border-radius: 24px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); /* 果冻回弹曲线 */
            cursor: pointer;
        }

        .qr-wrapper:hover {
            transform: scale(1.06) rotate(-3deg); /* 鼠标移入时微微放大并倾斜 */
            border-color: var(--accent-color);
        }

        .qr-code-img {
            width: 200px;
            height: 200px;
            display: block;
            border-radius: 12px;
        }

        /* 扫描线：改成柔和的光晕线 */
        .scan-line {
            position: absolute;
            top: 0;
            left: 12px;
            width: calc(100% - 24px);
            height: 4px;
            background: var(--primary-color);
            border-radius: 4px;
            box-shadow: 0 4px 12px rgba(0, 194, 80, 0.4);
            animation: scan 2.5s infinite ease-in-out;
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 12px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: calc(100% - 16px); opacity: 0; }
        }

        .instructions {
            margin-top: 25px;
            color: #666;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 500;
        }

        /* 底部装饰 */
        .footer-info {
            margin-top: 30px;
            font-size: 13px;
            color: #ccc;
        }

        /* 登录成功后的加载覆盖层 */
        #success-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 35px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        /* 可爱版加载动画 */
        .spinner {
            width: 45px;
            height: 45px;
            border: 5px solid #ffe5ec;
            border-top: 5px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; /* 带有弹性的旋转 */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div id="success-overlay">
        <div class="spinner"></div>
        <p style="color: var(--accent-color); font-weight: 700; margin-top: 15px; font-size: 16px;">登录成功，跳转中 ฅ^•ﻌ•^ฅ</p>
    </div>

    <h1>拼团交易登录</h1>
    <p class="subtitle">✨ 安全交易 · 扫码即入 ✨</p>

    <div class="qr-wrapper">
        <div class="scan-line"></div>
        <img id="qr-code-img" class="qr-code-img" src="./images/placeholder.png" alt="微信二维码">
    </div>

    <p class="instructions">
        <img src="https://img.icons8.com/color/48/000000/weixing.png" width="22" alt="wechat">
        请使用微信扫一扫
    </p>

    <div class="footer-info">
        &copy; 2025 daoha 版权所有
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // 请求你本地的 API 地址
        fetch('http://group.daoha.top/api/v1/login/weixin_qrcode_ticket')
            .then(response => response.json())
            .then(data => {
                if (data.code === "0000") {
                    const ticket = data.data;
                    const qrCodeImg = document.getElementById('qr-code-img');
                    qrCodeImg.src = `https://mp.weixin.qq.com/cgi-bin/showqrcode?ticket=${ticket}`;

                    const intervalId = setInterval(() => {
                        checkLoginStatus(ticket, intervalId);
                    }, 3000);
                } else {
                    console.error('获取二维码失败:', data.info);
                }
            })
            .catch(error => {
                console.error('请求失败:', error);
            });

        function checkLoginStatus(ticket, intervalId) {
            fetch(`http://group.daoha.top/api/v1/login/check_login?ticket=${ticket}`)
                .then(response => response.json())
                .then(data => {
                    if (data.code === "0000") {
                        // 增加视觉反馈：显示成功遮罩
                        document.getElementById('success-overlay').style.display = 'flex';

                        clearInterval(intervalId);

                        // 按照你之前的要求：将键名改为 username，有效期设为 2 天
                        setCookie('username', data.data, 2);

                        // 延迟 1.5 秒跳转，让用户看到可爱的加载动画
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1500);
                    } else {
                        console.info("等待扫码...");
                    }
                })
                .catch(error => {
                    console.error('请求失败:', error);
                });
        }

        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + date.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }
    });
</script>
</body>
</html>
