<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>潮玩拼团系统 - 安全登录</title>
    <style>
        :root {
            --primary-color: #00c250; /* 柔和的微信绿 */
            --accent-color: #ff9a9e;  /* 可爱的点缀粉 */
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --card-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-gradient);
            background-image: radial-gradient(#ffceec 1px, transparent 1px);
            background-size: 30px 30px;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .login-container {
            background: #ffffff;
            padding: 45px 30px;
            border-radius: 35px;
            box-shadow: var(--card-shadow);
            text-align: center;
            width: 100%;
            max-width: 360px;
            position: relative;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            margin: 0 0 8px 0;
            color: #4a4a4a;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 25px;
            background: #f4f6f8;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .qr-wrapper {
            position: relative;
            display: inline-block;
            padding: 12px;
            background: #fff;
            border: 2px dashed #ffe5ec;
            border-radius: 24px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }

        .qr-wrapper:hover {
            transform: scale(1.06) rotate(-3deg);
            border-color: var(--accent-color);
        }

        .qr-code-img {
            width: 200px;
            height: 200px;
            display: block;
            border-radius: 12px;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 12px;
            width: calc(100% - 24px);
            height: 4px;
            background: var(--primary-color);
            border-radius: 4px;
            box-shadow: 0 4px 12px rgba(0, 194, 80, 0.4);
            animation: scan 2.5s infinite ease-in-out;
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 12px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: calc(100% - 16px); opacity: 0; }
        }

        .instructions {
            margin-top: 25px;
            color: #666;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 500;
        }

        /* 新增：无痕登录按钮样式（参考老师的截图） */
        .incognito-btn {
            background-color: #1677ff;
            color: #ffffff;
            border: none;
            padding: 12px 0;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .incognito-btn:hover {
            background-color: #0958d9;
        }

        .footer-info {
            margin-top: 20px;
            font-size: 13px;
            color: #ccc;
        }

        #success-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 35px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 5px solid #ffe5ec;
            border-top: 5px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div id="success-overlay">
        <div class="spinner"></div>
        <p style="color: var(--accent-color); font-weight: 700; margin-top: 15px; font-size: 16px;">登录成功，跳转中 ฅ^•ﻌ•^ฅ</p>
    </div>

    <h1>欢迎登录 - 潮玩拼团</h1>
    <p class="subtitle">✨ 安全交易 · 扫码即入 ✨</p>

    <div class="qr-wrapper">
        <div class="scan-line"></div>
        <img id="qr-code-img" class="qr-code-img" src="./images/placeholder.png" alt="微信二维码">
    </div>

    <p class="instructions">
        <img src="https://img.icons8.com/color/48/000000/weixing.png" width="22" alt="wechat">
        请使用微信扫描二维码登录<br>扫码后自动登录商城
    </p>

    <button class="incognito-btn" id="incognito-btn">无痕登录 (浏览器指纹)</button>

    <div class="footer-info">
        &copy; 2025 daoha 版权所有
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {

        // 1. 引入指纹生成库
        const fpPromise = import('https://openfpcdn.io/fingerprintjs/v4')
            .then(FingerprintJS => FingerprintJS.load());

        // 2. 获取指纹并请求接口
        fpPromise
            .then(fp => fp.get())
            .then(result => {
                const visitorId = result.visitorId;
                let sceneStr = visitorId.toUpperCase();
                console.log("当前浏览器指纹 sceneStr:", sceneStr);

                // 请求二维码
                fetch(`http://127.0.0.1:7860/api/v1/login/weixin_qrcode_ticket_scene?sceneStr=${sceneStr}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.code === "0000") {
                            const ticket = data.data;
                            const qrCodeImg = document.getElementById('qr-code-img');
                            qrCodeImg.src = `https://mp.weixin.qq.com/cgi-bin/showqrcode?ticket=${ticket}`;

                            // 开始轮询
                            const intervalId = setInterval(() => {
                                checkLoginStatus(ticket, sceneStr, intervalId);
                            }, 3000);
                        } else {
                            console.error('获取二维码失败:', data.info);
                        }
                    })
                    .catch(error => console.error('请求失败:', error));
            });

        // 3. 轮询检查扫码状态
        function checkLoginStatus(ticket, sceneStr, intervalId) {
            fetch(`http://127.0.0.1:7860/api/v1/login/check_login_scene?ticket=${ticket}&sceneStr=${sceneStr}`)
                .then(response => response.json())
                .then(data => {
                    if (data.code === "0000") {
                        clearInterval(intervalId); // 停止轮询

                        // 【关键修改1】：扫码成功后，除了存 Cookie，再往 localStorage 里存一份兜底！
                        setCookie('username', data.data, 2);
                        localStorage.setItem('fingerprint_token', data.data);

                        // 显示成功动画并跳转
                        document.getElementById('success-overlay').style.display = 'flex';
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1500);
                    } else {
                        console.info("等待扫码...");
                    }
                })
                .catch(error => console.error('请求失败:', error));
        }

        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + date.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        // ==========================================
        // 【关键修改2】：为“无痕登录”按钮绑定点击事件
        // ==========================================
        document.getElementById('incognito-btn').addEventListener('click', function() {
            // 去本地存储（哪怕禁用了 Cookie 这里通常也存在）里找之前存的 token
            const savedToken = localStorage.getItem('fingerprint_token');

            if (savedToken) {
                console.log("检测到本地无痕授权记录，直接放行！");
                // 为了让你看到效果，稍微改一下加载文字
                const overlay = document.getElementById('success-overlay');
                overlay.querySelector('p').innerText = "无痕授权成功，跳转中 ฅ^•ﻌ•^ฅ";
                overlay.style.display = 'flex';

                // 延迟跳转
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                // 如果本地没有，说明他从没扫过码，或者彻底清空了浏览器缓存
                alert("没有找到您的无痕登录记录，请先使用微信扫码登录一次哦！");
            }
        });
    });
</script>
</body>
</html>
